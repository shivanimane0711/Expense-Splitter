name: CI/CD

on:
  push:
    branches:
      - main
      - feature/improve-expense-validation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: flake8 --max-line-length=100 app.py test_app.py

      - name: Test
        run: pytest -v

  docker-build:
    name: Docker Build and Smoke Test
    needs: lint-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t expense-splitter .

      - name: Run Docker container
        run: docker run -d --name expense-splitter -p 5000:5000 expense-splitter

      - name: Smoke test health endpoint
        run: |
          sleep 5
          curl --fail http://127.0.0.1:5000/health

      - name: Show container logs
        if: always()
        run: docker logs expense-splitter

      - name: Stop container
        if: always()
        run: docker rm -f expense-splitter